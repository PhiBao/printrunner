name: printrunner-cycle
on:
  workflow_dispatch:
    inputs:
      waiver_symbol:
        description: 'Operator waiver: underlying symbol (empty = no waiver)'
        required: false
        default: ''
      waiver_event_date:
        description: 'Earnings event date YYYY-MM-DD'
        required: false
        default: '2026-09-10'
      waiver_structure:
        description: 'Structure kind'
        required: false
        default: 'call_debit_vertical'
      waiver_gates:
        description: 'Waivable edge gates (G9/G10 only — safety floor enforced in code)'
        required: false
        default: 'G9,G10'
      waiver_conviction:
        description: 'Conviction 3-5'
        required: false
        default: '5'
      waiver_reason:
        description: 'Operator thesis (>=20 chars, journaled)'
        required: false
        default: ''
  # Backup schedule in case the Cloudflare Worker dispatch fails — the
  # concurrency group serializes overlapping runs and cycles are idempotent.
  schedule:
    - cron: "7,27,47 13-20 * * 1-5"
concurrency:
  group: printrunner-cycle
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      # Alpaca CLI auth (env bundle, paper default — ALPACA_LIVE_TRADE unset).
      # ALPACA_SECRET_KEY is already set above; only the key-id needs a
      # second name for the CLI's ALPACA_API_KEY convention.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AIML_API_KEY: ${{ secrets.AIML_API_KEY }}
      OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
      OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Rolling state: SQLite + journal restored from the previous run's cache
      # so calendar confirm_cycles, halt latch, and day counters survive
      # across CI runs (fresh checkouts start empty — without this the P5
      # two-observation gate can never pass in production). Saved under a
      # unique key per run; restored via prefix match to the latest save.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: printrunner-state-${{ github.run_id }}
          restore-keys: |
            printrunner-state-
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Alpaca CLI (official alpacahq/cli, paper default)
        run: go install github.com/alpacahq/cli/cmd/alpaca@latest && echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run cycle (Supabase, no git commit)
        run: uv run pr cycle
      # Safety-floored operator waiver: only G9/G10 waivable (enforced in
      # execution/waiver.py); G1-G8 failures refuse. Runs after the normal
      # cycle so reconcile/exits are always evaluated first, in the same DB.
      - name: Operator waiver entry (audited)
        if: ${{ inputs.waiver_symbol != '' }}
        run: >
          uv run pr override
          --symbol "${{ inputs.waiver_symbol }}"
          --event-date "${{ inputs.waiver_event_date }}"
          --structure "${{ inputs.waiver_structure }}"
          --waive "${{ inputs.waiver_gates }}"
          --conviction "${{ inputs.waiver_conviction }}"
          --reason "${{ inputs.waiver_reason }}"
          --confirm OVERRIDE
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: printrunner-state-${{ github.run_id }}
