[project]
name = "printrunner"
version = "0.1.0"
description = "PrintRunner: an autonomous, auditable earnings-season options agent for Alpaca paper trading. LLM least-trusted, defined-risk only, fail-closed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kiter" }]
dependencies = [
    "alpaca-py>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
]

[project.scripts]
pr = "printrunner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printrunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
